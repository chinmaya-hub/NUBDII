<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Photos ❤️</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Photo Gallery */
        .photo-gallery {
            display: grid;
            grid-template-columns: minmax(0, 650px);
            justify-content: center;
            gap: 25px;
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
        }

        /* Photo Card */
        .photo-card {
            width: 100%;
            min-width: 0;
            overflow: hidden;
            border-radius: 18px;
            background: #101014;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        /* Photo Container */
        .photo-wrapper {
            width: 100%;
            height: 440px;
            overflow: hidden;
            border-radius: 17px 17px 0 0;
            background: #08080b;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Gallery Photo */
        .photo-wrapper img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .photo-wrapper img:hover {
            transform: scale(1.02);
        }

        /* Photo Caption */
        .photo-caption {
            padding: 24px 26px 28px;
            text-align: left;
            box-sizing: border-box;
        }

        .photo-caption span {
            display: block;
            color: #ff9fbd;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .photo-caption h2 {
            margin: 0 0 12px;
            font-size: 27px;
            line-height: 1.4;
            overflow-wrap: break-word;
        }

        .photo-caption p {
            margin: 0;
            font-size: 15px;
            line-height: 1.8;
            color: #b9b6c2;
        }

        /* Full-Screen Photo Viewer */
        #photoLightbox {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.97);
            z-index: 999999;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 25px;
            box-sizing: border-box;
        }

        #photoLightbox.active {
            display: flex;
        }

        /* Full-Screen Image */
        #photoLightbox img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 5px;
            cursor: default;
        }

        /* Close Button */
        .lightbox-close {
            position: absolute;
            top: 12px;
            right: 22px;
            color: white;
            background: transparent;
            border: none;
            font-size: 42px;
            font-weight: normal;
            line-height: 1;
            cursor: pointer;
            padding: 5px 10px;
            z-index: 1000000;
        }

        .lightbox-close:hover {
            color: #ffb6d9;
        }

        /* Mobile Responsive */
        @media (max-width: 600px) {

            .photo-gallery {
                grid-template-columns: minmax(0, 1fr);
                padding: 0 12px;
                gap: 20px;
            }

            .photo-wrapper {
                height: 350px;
            }

            .photo-caption {
                padding: 20px 18px 24px;
            }

            .photo-caption h2 {
                font-size: 23px;
            }

            .photo-caption p {
                font-size: 14px;
            }

            #photoLightbox {
                padding: 55px 10px 15px;
            }

            .lightbox-close {
                top: 10px;
                right: 12px;
            }
        }

    </style>

</head>

<body>

    <!-- Navigation -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Our Little World ❤️
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="games.html">
                Game Moments
            </a>

            <a href="chats.html">
                Chat Moments
            </a>

            <a href="photos.html" class="active">
                Photos
            </a>

        </nav>

    </header>

    <main class="page">

        <!-- Page Heading -->

        <section class="page-heading">

            <p class="small-title">
                OUR FAVOURITE MEMORIES
            </p>

            <h1>
                Photos 📸
            </h1>

            <p>
                A little collection of beautiful memories.
            </p>

        </section>

        <!-- Photo Gallery -->

        <section class="photo-gallery">

            <article class="photo-card">

                <!-- Photo -->

                <div class="photo-wrapper">

                    <img
                        src="NUBDII.jpg"
                        alt="You are my favourite distraction"
                        loading="lazy"
                        onclick="openLightbox(this)"
                    >

                </div>

                <!-- Updated Caption -->

                <div class="photo-caption">

                    <span>
                        ANOTHER SPECIAL MEMORY 💗
                    </span>

                    <h2>
                        You Are My Favourite Distraction 💗
                    </h2>

                    <p>
                        And somehow, I never want to be distracted from you. ❤️
                    </p>

                </div>

            </article>

        </section>

    </main>

    <!-- Footer -->

    <footer>
        Made with ❤️ for our little world.
    </footer>

    <!-- Full-Screen Photo Viewer -->

    <div
        id="photoLightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Full-screen photo viewer"
        onclick="closeLightbox()"
    >

        <!-- Close Button -->

        <button
            type="button"
            class="lightbox-close"
            aria-label="Close full-screen photo"
            onclick="closeLightbox()"
        >
            &times;
        </button>

        <!-- Full-Screen Image -->

        <img
            id="lightboxImage"
            src=""
            alt="Full-screen memory"
        >

    </div>

    <!-- JavaScript -->

    <script>

        // Open the selected photo in full screen

        function openLightbox(photo) {

            const lightbox = document.getElementById("photoLightbox");
            const lightboxImage = document.getElementById("lightboxImage");

            lightboxImage.src = photo.src;
            lightboxImage.alt = photo.alt;

            lightbox.classList.add("active");

            document.body.style.overflow = "hidden";

        }

        // Close the full-screen photo

        function closeLightbox() {

            const lightbox = document.getElementById("photoLightbox");

            lightbox.classList.remove("active");

            document.body.style.overflow = "";

        }

        // Prevent closing when clicking directly on the photo

        document.getElementById("lightboxImage").addEventListener("click", function(event) {

            event.stopPropagation();

        });

        // Close the photo when pressing Escape

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {

                closeLightbox();

            }

        });

    </script>

</body>
</html>
